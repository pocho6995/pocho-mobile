# Только билд артефактов (APK / IPA). Без загрузки в Google Play / App Store / TestFlight.

workflows:
  android-build:
    name: PoCho Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        APP_VERSION: "2.0.2"
        API_BASE_URL: https://olmatech.uz
        WS_BASE_URL: wss://olmatech.uz
      flutter: stable
    scripts:
      - name: Create .env
        script: |
          echo "API_BASE_URL=${API_BASE_URL}" > "$CM_BUILD_DIR/.env"
          echo "WS_BASE_URL=${WS_BASE_URL}" >> "$CM_BUILD_DIR/.env"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run unit tests
        script: |
          flutter test

      - name: Build APK (release)
        script: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="$((BUILD_NUMBER))"

      - name: Build App Bundle (release)
        script: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="$((BUILD_NUMBER))"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

  ios-build:
    name: PoCho iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      # Нужен для подписи IPA. Имя ключа в Codemagic → Integrations.
      app_store_connect: PoCho
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.olmatech.pocho
      vars:
        APP_VERSION: "2.0.2"
        API_BASE_URL: https://olmatech.uz
        WS_BASE_URL: wss://olmatech.uz
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env
        script: |
          echo "API_BASE_URL=${API_BASE_URL}" > "$CM_BUILD_DIR/.env"
          echo "WS_BASE_URL=${WS_BASE_URL}" >> "$CM_BUILD_DIR/.env"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set version
        script: |
          cd ios
          agvtool new-version -all "$((BUILD_NUMBER))"
          agvtool new-marketing-version "$APP_VERSION"

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$((BUILD_NUMBER))" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
