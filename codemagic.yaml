# Android APK/AAB + iOS Simulator .app
# Без iOS code signing / Provisioning Profile / App Store.
#
# В Codemagic запускай только:
#   - PoCho Android Build
#   - PoCho iOS Simulator

workflows:

  # ============================================================
  # ANDROID
  # ============================================================

  android-build:
    name: PoCho Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        APP_VERSION: "2.0.2"
        API_BASE_URL: https://olmatech.uz
        WS_BASE_URL: wss://olmatech.uz

      flutter: stable

    scripts:

      - name: Create .env
        script: |
          echo "API_BASE_URL=${API_BASE_URL}" > "$CM_BUILD_DIR/.env"
          echo "WS_BASE_URL=${WS_BASE_URL}" >> "$CM_BUILD_DIR/.env"

      - name: Flutter doctor
        script: |
          flutter doctor -v

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run unit tests
        script: |
          flutter test

      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Build App Bundle
        script: |
          flutter build appbundle \
            --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab


  # ============================================================
  # IOS SIMULATOR
  # ============================================================

  ios-simulator:
    name: PoCho iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      vars:
        APP_VERSION: "2.0.2"
        API_BASE_URL: https://olmatech.uz
        WS_BASE_URL: wss://olmatech.uz

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:

      - name: Create .env
        script: |
          echo "API_BASE_URL=${API_BASE_URL}" > "$CM_BUILD_DIR/.env"
          echo "WS_BASE_URL=${WS_BASE_URL}" >> "$CM_BUILD_DIR/.env"

      # google_maps_flutter_ios пока не поддерживает SwiftPM
      # Поэтому используем CocoaPods
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Flutter doctor
        script: |
          flutter doctor -v

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS Simulator
        script: |
          flutter build ios \
            --simulator \
            --debug \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Verify Simulator App
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/iphonesimulator/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found:"
            echo "$APP_PATH"
            exit 1
          fi

          echo "======================================"
          echo "iOS Simulator build successful"
          echo "======================================"
          echo "App:"
          echo "$APP_PATH"
          echo ""
          echo "Size:"
          du -sh "$APP_PATH"

    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log