workflows:
  ios-release:
    name: PoCho iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      # Имя API-ключа из Codemagic → Teams → Integrations → App Store Connect
      # Должно совпадать с именем ключа в UI (см. README ниже).
      app_store_connect: PoCho
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.olmatech.pocho
      vars:
        BUNDLE_ID: uz.olmatech.pocho
        APP_VERSION: "2.0.1"
        API_BASE_URL: https://olmatech.uz
        WS_BASE_URL: wss://olmatech.uz
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env (gitignored asset)
        script: |
          echo "API_BASE_URL=${API_BASE_URL}" > "$CM_BUILD_DIR/.env"
          echo "WS_BASE_URL=${WS_BASE_URL}" >> "$CM_BUILD_DIR/.env"
          echo "Created .env:"
          cat "$CM_BUILD_DIR/.env"

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set build number from Codemagic
        script: |
          cd ios
          agvtool new-version -all "$((BUILD_NUMBER))"
          agvtool new-marketing-version "$APP_VERSION"

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$((BUILD_NUMBER))" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Сначала TestFlight; App Store submission включайте отдельно когда готовы
        submit_to_testflight: true
        submit_to_app_store: false

  ios-ad-hoc:
    name: PoCho iOS Ad Hoc (devices)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: PoCho
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: uz.olmatech.pocho
      vars:
        BUNDLE_ID: uz.olmatech.pocho
        APP_VERSION: "2.0.1"
        API_BASE_URL: https://olmatech.uz
        WS_BASE_URL: wss://olmatech.uz
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env (gitignored asset)
        script: |
          echo "API_BASE_URL=${API_BASE_URL}" > "$CM_BUILD_DIR/.env"
          echo "WS_BASE_URL=${WS_BASE_URL}" >> "$CM_BUILD_DIR/.env"

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set build number from Codemagic
        script: |
          cd ios
          agvtool new-version -all "$((BUILD_NUMBER))"
          agvtool new-marketing-version "$APP_VERSION"

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$((BUILD_NUMBER))" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
